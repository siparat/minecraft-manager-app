<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="60%" stop-color="#7EC8E3"/>
      <stop offset="100%" stop-color="#B5E8F7"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="960" height="540" fill="url(#sky)"/>

  <!-- Sun -->
  <rect x="720" y="40" width="64" height="64" fill="#FFFDE7"/>
  <rect x="724" y="44" width="56" height="56" fill="#FFF9C4"/>
  <rect x="728" y="48" width="48" height="48" fill="#FFF176"/>

  <!-- Clouds -->
  <g fill="#fff" opacity="0.85">
    <rect x="80" y="60" width="120" height="24"/>
    <rect x="64" y="72" width="40" height="24"/>
    <rect x="180" y="72" width="40" height="24"/>

    <rect x="350" y="90" width="160" height="24"/>
    <rect x="340" y="102" width="48" height="24"/>

    <rect x="600" y="50" width="100" height="24"/>
    <rect x="580" y="62" width="40" height="24"/>
    <rect x="680" y="62" width="40" height="24"/>
  </g>

  <!-- Distant mountains -->
  <g fill="#5B8731">
    <rect x="0" y="260" width="960" height="20"/>
    <rect x="40" y="240" width="80" height="20"/>
    <rect x="60" y="220" width="40" height="20"/>
    <rect x="200" y="240" width="120" height="20"/>
    <rect x="220" y="220" width="80" height="20"/>
    <rect x="240" y="200" width="40" height="20"/>
    <rect x="400" y="240" width="100" height="20"/>
    <rect x="420" y="220" width="60" height="20"/>
    <rect x="560" y="240" width="140" height="20"/>
    <rect x="580" y="220" width="100" height="20"/>
    <rect x="600" y="200" width="60" height="20"/>
    <rect x="620" y="180" width="20" height="20"/>
    <rect x="760" y="240" width="120" height="20"/>
    <rect x="780" y="220" width="80" height="20"/>
    <rect x="800" y="200" width="40" height="20"/>
    <rect x="880" y="240" width="80" height="20"/>
  </g>

  <!-- Grass layer -->
  <rect x="0" y="280" width="960" height="20" fill="#5D9C27"/>
  <rect x="0" y="300" width="960" height="20" fill="#4E8B20"/>

  <!-- Dirt layers -->
  <rect x="0" y="320" width="960" height="220" fill="#8B5E3C"/>
  <g fill="#7A5230" opacity="0.6">
    <rect x="20" y="340" width="20" height="20"/>
    <rect x="100" y="360" width="20" height="20"/>
    <rect x="200" y="340" width="20" height="20"/>
    <rect x="300" y="380" width="20" height="20"/>
    <rect x="400" y="350" width="20" height="20"/>
    <rect x="500" y="370" width="20" height="20"/>
    <rect x="600" y="340" width="20" height="20"/>
    <rect x="700" y="360" width="20" height="20"/>
    <rect x="800" y="380" width="20" height="20"/>
    <rect x="900" y="350" width="20" height="20"/>
    <rect x="60" y="400" width="20" height="20"/>
    <rect x="160" y="420" width="20" height="20"/>
    <rect x="260" y="440" width="20" height="20"/>
    <rect x="360" y="410" width="20" height="20"/>
    <rect x="460" y="430" width="20" height="20"/>
    <rect x="560" y="400" width="20" height="20"/>
    <rect x="660" y="440" width="20" height="20"/>
    <rect x="760" y="420" width="20" height="20"/>
    <rect x="860" y="400" width="20" height="20"/>
    <rect x="140" y="480" width="20" height="20"/>
    <rect x="340" y="490" width="20" height="20"/>
    <rect x="540" y="470" width="20" height="20"/>
    <rect x="740" y="500" width="20" height="20"/>
  </g>

  <!-- Stone layer at bottom -->
  <rect x="0" y="500" width="960" height="40" fill="#7B7B7B"/>
  <g fill="#6B6B6B">
    <rect x="40" y="500" width="20" height="20"/>
    <rect x="120" y="520" width="20" height="20"/>
    <rect x="280" y="500" width="20" height="20"/>
    <rect x="440" y="520" width="20" height="20"/>
    <rect x="600" y="500" width="20" height="20"/>
    <rect x="760" y="520" width="20" height="20"/>
    <rect x="880" y="500" width="20" height="20"/>
  </g>

  <!-- Tree 1 -->
  <g>
    <rect x="120" y="200" width="20" height="80" fill="#6B4226"/>
    <rect x="100" y="180" width="60" height="20" fill="#2D6E12"/>
    <rect x="80" y="200" width="100" height="20" fill="#3A8A1C"/>
    <rect x="80" y="220" width="100" height="20" fill="#2D6E12"/>
    <rect x="100" y="240" width="60" height="20" fill="#3A8A1C"/>
    <rect x="120" y="260" width="20" height="20" fill="#2D6E12"/>
  </g>

  <!-- Tree 2 -->
  <g>
    <rect x="480" y="180" width="20" height="100" fill="#6B4226"/>
    <rect x="440" y="140" width="80" height="20" fill="#2D6E12"/>
    <rect x="420" y="160" width="120" height="20" fill="#3A8A1C"/>
    <rect x="420" y="180" width="120" height="20" fill="#2D6E12"/>
    <rect x="420" y="200" width="120" height="20" fill="#3A8A1C"/>
    <rect x="440" y="220" width="80" height="20" fill="#2D6E12"/>
    <rect x="460" y="240" width="40" height="20" fill="#3A8A1C"/>
  </g>

  <!-- Tree 3 -->
  <g>
    <rect x="800" y="220" width="20" height="60" fill="#6B4226"/>
    <rect x="780" y="200" width="60" height="20" fill="#2D6E12"/>
    <rect x="760" y="220" width="100" height="20" fill="#3A8A1C"/>
    <rect x="780" y="240" width="60" height="20" fill="#2D6E12"/>
  </g>

  <!-- Flowers on grass -->
  <rect x="170" y="270" width="8" height="10" fill="#FF5252"/>
  <rect x="310" y="272" width="8" height="8" fill="#FFEB3B"/>
  <rect x="650" y="268" width="8" height="12" fill="#FF5252"/>
  <rect x="890" y="270" width="8" height="10" fill="#FFEB3B"/>
  <rect x="50" y="272" width="8" height="8" fill="#E040FB"/>
</svg>
